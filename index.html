<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Posts</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-10">

        <!-- Header -->
        <header class="mb-8">

            <h1 class="text-4xl font-bold">
                Blog Posts
            </h1>

            <p class="text-gray-500 mt-2">
                Explore our latest posts
            </p>

        </header>


        <!-- Controls -->
        <section class="flex flex-col sm:flex-row gap-4 mb-8">

            <!-- Search -->
            <div class="flex-1">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search posts..."
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>


            <!-- Favorites -->
            <button
                id="favoritesButton"
                class="px-5 py-3 bg-white border border-gray-200 rounded-xl hover:bg-gray-100 transition"
            >
                ⭐ Favorites (<span id="favoriteCount">0</span>)
            </button>

        </section>


        <!-- Posts -->
        <section
            id="postsContainer"
            class="grid grid-cols-1 md:grid-cols-2 gap-6"
        >

        </section>


        <!-- Loading -->
        <div
            id="loading"
            class="hidden text-center py-10 text-gray-500"
        >
            Loading posts...
        </div>


        <!-- Error -->
        <div
            id="errorMessage"
            class="hidden text-center py-10 text-red-500"
        >
            Failed to load posts.
        </div>


        <div
            id="emptyState"
            class="hidden text-center py-10 text-gray-500"
        >
            No posts found.
        </div>

    </main>
    <script type="module" src="./src/script.js"></script>
</body>
</html>
